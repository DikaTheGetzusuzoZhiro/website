<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMA MUSIC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <aside class="sidebar">
    <div class="logo">TAMA<span>MUSIC</span></div>

    <nav>
      <button class="nav active" data-page="home">⌂ <span>Home</span></button>
      <button class="nav" data-page="search">⌕ <span>Search</span></button>
      <button class="nav" data-page="library">♡ <span>Library</span></button>
    </nav>

    <div class="side-bottom">
      <button id="loginBtn" class="login-btn">Login Spotify</button>
    </div>
  </aside>

  <main>

    <header>
      <button class="mobile-menu" id="menuBtn">☰</button>

      <div class="search-box">
        <span>⌕</span>
        <input id="searchInput" placeholder="Cari lagu, artis, album...">
      </div>

      <button id="profileBtn" class="profile">♪</button>
    </header>

    <section id="homePage" class="page active-page">

      <div class="hero">
        <div>
          <small>TAMA MUSIC</small>
          <h1>Music for<br>your mood.</h1>
          <p>Cari dan temukan musik favoritmu.</p>
          <button class="hero-btn" onclick="focusSearch()">Mulai Cari</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <h2>Musik Populer</h2>
          <button onclick="searchPopular()">Lihat semua</button>
        </div>

        <div id="popularGrid" class="music-grid"></div>
      </div>

    </section>

    <section id="searchPage" class="page">

      <div class="search-heading">
        <h1>Search</h1>
        <p id="searchStatus">Cari musik favoritmu.</p>
      </div>

      <div id="searchResults" class="result-list"></div>

    </section>

    <section id="libraryPage" class="page">

      <div class="search-heading">
        <h1>Library</h1>
        <p>Lagu yang kamu simpan.</p>
      </div>

      <div id="libraryGrid" class="music-grid"></div>

    </section>

  </main>

  <div id="player" class="player">

    <div class="now-playing">
      <img id="playerCover" src="https://via.placeholder.com/70">
      <div>
        <strong id="playerTitle">Belum ada lagu</strong>
        <small id="playerArtist">Pilih lagu untuk melihat detail</small>
      </div>
    </div>

    <div class="controls">
      <button onclick="previousTrack()">⏮</button>
      <button id="playBtn" class="play-btn" onclick="togglePlay()">▶</button>
      <button onclick="nextTrack()">⏭</button>
    </div>

    <div class="progress-area">
      <span id="currentTime">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>

    <div class="volume">
      🔊
      <input id="volume" type="range" min="0" max="100" value="80">
    </div>

  </div>

  <div id="detailModal" class="modal">
    <div class="modal-content">

      <button class="close" onclick="closeModal()">×</button>

      <img id="detailCover" class="detail-cover">

      <h1 id="detailTitle"></h1>
      <p id="detailArtist"></p>
      <p id="detailAlbum"></p>

      <a id="spotifyLink" target="_blank" class="spotify-btn">
        Buka di Spotify
      </a>

      <div class="lyrics">
        <h2>🎤 Lirik</h2>
        <p id="lyricsText">
          Lirik belum tersedia untuk lagu ini.
        </p>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
