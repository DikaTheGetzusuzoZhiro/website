<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tama Ryuichi - Official Store</title>
    <meta property="og:title" content="Tama Ryuichi - Official Store" />
    <meta property="og:description" content="Pusat Layanan Script Monetloader Gta Samp, Bot Discord & Jual Beli Game Terbaik." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ff5500" />
    <meta name="twitter:card" content="summary_large_image" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ============================================================
               ROOT & RESET
               ============================================================ */
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: rgba(16, 16, 24, 0.8);
            --accent: #ff5500;
            --accent-glow: rgba(255, 85, 0, 0.6);
            --accent-soft: #ff7b2b;
            --wa: #25D366;
            --text: #f0f0f5;
            --muted: #a0a0b8;
            --border-glass: rgba(255, 255, 255, 0.06);
            --radius: 20px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(ellipse at 20% 10%, #1f0d00 0%, var(--bg-dark) 55%, #030303 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255, 85, 0, 0.03), transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(255, 40, 0, 0.02), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 12s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 12px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        /* ============================================================
               AMBIENT GLOW ORBS
               ============================================================ */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -100px;
            background: radial-gradient(circle, #ff5500, transparent 70%);
            animation-duration: 22s;
        }
        .orb--2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -80px;
            background: radial-gradient(circle, #ff2a00, transparent 70%);
            animation-duration: 26s;
            animation-delay: -6s;
        }
        .orb--3 {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 60%;
            background: radial-gradient(circle, #ff8c00, transparent 70%);
            animation-duration: 20s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.15);
            }
        }

        /* ============================================================
               SIDEBAR
               ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 290px;
            height: 100%;
            background: rgba(8, 8, 12, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 1100;
            transition: left 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 28px 22px;
            border-right: 1px solid var(--border-glass);
            box-shadow: 12px 0 50px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 28px;
        }

        .sidebar-logo {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-logo .logo-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .sidebar-logo .logo-text span {
            background: linear-gradient(135deg, #ff8c00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-close {
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.3s;
            line-height: 1;
        }
        .sidebar-close:hover {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }
        .sidebar-menu li {
            margin-bottom: 4px;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 13px 16px;
            border-radius: 14px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .sidebar-menu a i {
            width: 22px;
            font-size: 17px;
            text-align: center;
            transition: 0.3s;
        }
        .sidebar-menu a:hover,
        .sidebar-menu a.active-link {
            background: linear-gradient(90deg, rgba(255, 85, 0, 0.12), transparent 80%);
            color: #fff;
            transform: translateX(6px);
        }
        .sidebar-menu a:hover i,
        .sidebar-menu a.active-link i {
            color: var(--accent);
            text-shadow: 0 0 18px var(--accent-glow);
        }
        .sidebar-menu a.active-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border-glass);
            margin: 16px 0 18px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ============================================================
               NAVBAR
               ============================================================ */
        nav {
            position: sticky;
            top: 0;
            z-index: 99;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 5%;
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glass);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .nav-logo {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-logo .logo-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .nav-logo .logo-text span {
            background: linear-gradient(135deg, #ff8c00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-clock {
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        .nav-clock i {
            margin-right: 6px;
            color: var(--accent);
        }

        .nav-toggle {
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.3s;
            padding: 4px 8px;
            border-radius: 10px;
        }
        .nav-toggle:hover {
            color: var(--accent);
            background: rgba(255, 85, 0, 0.08);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* ============================================================
               FLOATING WHATSAPP BUTTON
               ============================================================ */
        .wa-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: #25D366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            font-size: 32px;
            border: none;
            animation: waPulse 2s infinite;
        }
        .wa-float:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.6);
        }
        @keyframes waPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        /* ============================================================
               OVERLAY
               ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1050;
            animation: overlayFade 0.3s ease;
        }
        .overlay.show {
            display: block;
        }

        @keyframes overlayFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ============================================================
               PAGE VIEWS (SPA)
               ============================================================ */
        .page-view {
            display: none;
            animation: pageEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .page-view.active {
            display: block;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               HERO
               ============================================================ */
        .hero {
            position: relative;
            width: 100%;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 24px 60px;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(255, 85, 0, 0.12), transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(255, 40, 0, 0.08), transparent 50%),
                linear-gradient(180deg, rgba(10, 10, 10, 0.3) 0%, var(--bg-dark) 100%);
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 780px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 85, 0, 0.12);
            border: 1px solid rgba(255, 85, 0, 0.2);
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-soft);
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
            animation: fadeUp 1s ease both;
            box-shadow: 0 0 30px rgba(255, 85, 0, 0.05);
        }
        .hero-badge i {
            margin-right: 8px;
        }

        .hero h1 {
            font-size: clamp(36px, 8vw, 68px);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -1.5px;
            animation: fadeUp 1s ease 0.15s both;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, #ff8c00, #ff2a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px var(--accent-glow));
        }

        .hero p {
            font-size: clamp(15px, 1.6vw, 19px);
            color: var(--muted);
            max-width: 560px;
            margin: 18px auto 0;
            font-weight: 500;
            animation: fadeUp 1s ease 0.3s both;
        }

        .hero-actions {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            animation: fadeUp 1s ease 0.45s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .btn--primary {
            background: linear-gradient(135deg, #ff7b00, #ff2a00);
            color: #fff;
            box-shadow: 0 6px 30px var(--accent-glow);
        }
        .btn--primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ff8c00, #ff3d00);
            opacity: 0;
            transition: 0.4s;
        }
        .btn--primary:hover::before {
            opacity: 1;
        }
        .btn--primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 45px var(--accent-glow);
        }
        .btn--primary span {
            position: relative;
            z-index: 2;
        }

        .btn--ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: #fff;
            backdrop-filter: blur(10px);
        }
        .btn--ghost:hover {
            border-color: var(--accent);
            background: rgba(255, 85, 0, 0.06);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               CONTAINER & TITLES
               ============================================================ */
        .container {
            padding: 50px 24px;
            max-width: 880px;
            margin: 0 auto;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 32px;
        }
        .section-title i {
            color: var(--accent);
            font-size: 20px;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent 80%);
            border-radius: 4px;
            opacity: 0.4;
        }

        /* ============================================================
               SOCIAL GRID
               ============================================================ */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 48px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.8px;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(8px);
        }
        .social-btn i {
            font-size: 18px;
        }
        .social-btn:hover {
            border-color: var(--accent);
            background: rgba(255, 85, 0, 0.06);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 85, 0, 0.06);
        }

        /* ============================================================
               FREE BOX
               ============================================================ */
        .free-box {
            background: linear-gradient(135deg, rgba(255, 85, 0, 0.06), var(--bg-card));
            border: 1px solid rgba(255, 85, 0, 0.15);
            border-radius: var(--radius);
            padding: 36px 32px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
        }
        .free-box:hover {
            border-color: rgba(255, 85, 0, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 85, 0, 0.05);
        }
        .free-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff8c00, #ff2a00);
            box-shadow: 0 0 30px var(--accent);
        }
        .free-box h4 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .free-box p {
            color: var(--muted);
            font-size: 15px;
            font-weight: 500;
            max-width: 500px;
            margin: 0 auto 24px;
        }

        .btn--download {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--accent);
            color: #fff;
            padding: 13px 32px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn--download:hover {
            background: var(--accent);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 40px var(--accent-glow);
        }

        /* ============================================================
               CARDS (service)
               ============================================================ */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 30px 28px;
            margin-bottom: 32px;
            border: 1px solid var(--border-glass);
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            transition: 0.6s ease;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .card:hover::after {
            width: 100%;
        }
        .card:hover {
            border-color: rgba(255, 85, 0, 0.2);
            transform: translateY(-6px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 85, 0, 0.04);
            background: rgba(22, 22, 30, 0.85);
        }

        .card-img {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 14px;
            margin-bottom: 22px;
            position: relative;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }
        .card:hover .card-img img {
            transform: scale(1.06);
        }
        .card-img::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(to top, rgba(10, 10, 10, 0.9), transparent);
        }

        .card h3 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
        }

        .card ul {
            list-style: none;
            margin-bottom: 28px;
        }
        .card ul li {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            padding: 6px 0;
            line-height: 1.5;
        }
        .card ul li i {
            color: var(--accent);
            font-size: 15px;
            margin-top: 3px;
            text-shadow: 0 0 12px var(--accent-glow);
            width: 18px;
            text-align: center;
        }
        .card ul li strong {
            color: #fff;
            font-weight: 700;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-glass);
            flex-wrap: wrap;
            gap: 16px;
        }
        .price {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .price span {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-soft);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn--buy {
            background: #fff;
            color: #0a0a0a;
            border: none;
            padding: 13px 30px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        }
        .btn--buy:hover {
            background: linear-gradient(135deg, #ff7b00, #ff2a00);
            color: #fff;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 35px var(--accent-glow);
        }

        /* ============================================================
               INFO LIST (tutorial / faq)
               ============================================================ */
        .info-list {
            list-style: none;
            padding: 0;
            color: var(--muted);
            font-size: 15px;
            font-weight: 500;
            counter-reset: step;
        }
        .info-list li {
            counter-increment: step;
            display: flex;
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            line-height: 1.7;
        }
        .info-list li:last-child {
            border-bottom: none;
        }
        .info-list li::before {
            content: counter(step);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            background: rgba(255, 85, 0, 0.1);
            border: 1px solid rgba(255, 85, 0, 0.15);
            border-radius: 50%;
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .info-list li strong {
            color: #fff;
            font-weight: 700;
        }

        .faq-item {
            padding: 22px 24px;
            margin-bottom: 18px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            transition: all 0.3s ease;
        }
        .faq-item:hover {
            border-color: rgba(255, 85, 0, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        .faq-item .q {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .faq-item .q i {
            color: var(--accent);
            font-size: 18px;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .faq-item .a {
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            padding-left: 38px;
            line-height: 1.8;
        }
        .faq-item .a strong {
            color: #fff;
        }

        /* ============================================================
               MODAL
               ============================================================ */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal.show {
            opacity: 1;
            display: flex;
        }

        .modal-box {
            background: #14141a;
            border-radius: var(--radius);
            padding: 38px 32px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 85, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 85, 0, 0.04);
            transform: translateY(30px) scale(0.96);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .modal.show .modal-box {
            transform: translateY(0) scale(1);
        }
        .modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff8c00, #ff2a00);
        }

        .modal-box h3 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .modal-box .order-label {
            color: var(--accent-soft);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 28px;
            display: block;
        }

        .pay-item {
            display: flex;

            background: rgba(255, 255, 255, 0.02);

        .pay-item .label {

            color: var(--muted);

        }
        .pay-item .value {

        .pay-item .copy-icon {
